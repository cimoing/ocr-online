<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PP-OCRv5 在线 OCR</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⌖</span>
      <div>
        <h1>PP-OCRv5 在线 OCR</h1>
        <p class="sub">拖入 / 粘贴 / 选择图片 · 服务端与移动端模型对比</p>
      </div>
    </div>
    <div class="controls">
      <div class="segmented" id="modelSwitch" role="tablist" aria-label="模型选择">
        <button class="seg active" data-model="mobile" type="button">移动端 mobile</button>
        <button class="seg" data-model="server" type="button">服务端 server</button>
      </div>
      <button class="btn primary" id="recognizeBtn" type="button" disabled>识别</button>
      <button class="btn" id="copyBtn" type="button" disabled>复制全部</button>
      <button class="btn" id="peekBtn" type="button" disabled title="按住时隐藏识别文字、显示原图，松开恢复，用于对比">按住对比原图</button>
      <button class="btn" id="editBtn" type="button" disabled aria-pressed="false" title="微调文本区域：拖拽手柄改大小 · 拖空白处画新框 · ✕ 或 Delete 删除 · 改动后自动重新识别该区域">微调区域</button>
      <button class="btn ghost" id="clearBtn" type="button" disabled>清空</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="empty" id="empty">
      <div class="empty-inner">
        <div class="empty-icon">🖼️</div>
        <p class="empty-title">拖入图片到此处</p>
        <p class="empty-hint">或 粘贴 (Ctrl+V) · 或 <button class="link" id="pickBtn" type="button">点击选择文件</button></p>
      </div>
    </div>
    <div class="canvas" id="canvas" hidden>
      <img id="img" alt="待识别图片" />
      <div class="overlay" id="overlay"></div>
    </div>
  </main>

  <footer class="statusbar">
    <div class="bar-row">
      <span id="status" class="status">就绪 — 等待图片</span>
      <label class="mask-ctl" title="调节文字遮罩不透明度：高=用识别文字盖住原图，低=透出原图对照">
        文字遮罩
        <input type="range" id="maskRange" min="0" max="100" value="90" />
      </label>
    </div>
    <div id="timings" class="timings" hidden></div>
  </footer>

  <input type="file" id="fileInput" accept="image/*" hidden />
  <div class="toast" id="toast" hidden></div>
  <div class="spinner-overlay" id="spinner" hidden>
    <div class="spinner"></div>
    <span id="spinnerText">识别中…</span>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
